<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AR Resume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- Start the tracking download before the camera permission prompt. -->
  <link rel="preload" href="./assets/targets.mind" as="fetch" crossorigin="anonymous" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="./js/startup.js?v=camera-v2"></script>
  <script src="./config.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Top glass bar */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      color: #1f2937;
    }
    #topbar .name { font-weight: 700; font-size: 15px; }
    #topbar .hint { font-size: 12px; color: #6b7280; }
    /* Tap hint toast */
    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #374151;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="name" id="topbar-name">AR Resume</span>
    <span class="hint" id="startup-hint" role="status">Starting AR…</span>
  </div>
  <div id="toast">Tap a panel to open it</div>

  <!-- Acquire sooner and keep the last pose through brief tracking misses.
       Smoothing = MindAR's One Euro filter: cutoff = filterMinCF + filterBeta*|velocity|.
       A huge filterBeta makes tiny at-rest camera noise spike the cutoff and disable
       smoothing, so the panels shake when the page is still. Keep filterBeta small so a
       stationary page stays locked, and let filterMinCF give responsiveness when it moves.
       Tune live on-device with ?cf=<filterMinCF>&beta=<filterBeta> (see the script below). -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: yes; uiLoading: yes; warmupTolerance: 2; missTolerance: 15; filterMinCF: 0.001; filterBeta: 0.01"
    resume-camera
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"
              cursor="fuse: false; rayOrigin: mouse"
              raycaster="objects: .clickable; far: 10000"></a-camera>

    <a-entity id="anchor" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <!-- Live smoothing tuner: ?cf=0.001&beta=0.01 overrides the values above so you
       can dial in stability vs. responsiveness on a real phone without editing files.
       Runs during parse, before MindAR's component initializes, so the new values take. -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var cf = params.get("cf"), beta = params.get("beta");
      if (cf === null && beta === null) return;
      var scene = document.querySelector("a-scene");
      var cfg = scene.getAttribute("mindar-image");
      if (cf !== null && !isNaN(parseFloat(cf))) cfg = cfg.replace(/filterMinCF:\s*[^;]+/, "filterMinCF: " + parseFloat(cf));
      if (beta !== null && !isNaN(parseFloat(beta))) cfg = cfg.replace(/filterBeta:\s*[^;]+/, "filterBeta: " + parseFloat(beta));
      scene.setAttribute("mindar-image", cfg);
    })();
  </script>
  <script src="./js/app.js?v=handheld-v1"></script>
</body>
</html>
